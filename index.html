
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEIBA AI</title>
<style>
body{font-family:sans-serif;background:#f3f5f8;margin:0;color:#222;padding:18px}
header{background:#183b32;color:white;padding:22px;border-radius:14px}
h1{margin:0;font-size:27px}
.card{background:white;padding:18px;border-radius:14px;margin-top:16px}
button{padding:13px;border:0;border-radius:9px;background:#246b50;color:white;font-size:16px;margin:4px}
button.active{background:#d99a27}
input,select{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;width:100%;box-sizing:border-box;margin:6px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd;text-align:center}
.small{color:#777;font-size:13px}
.result{font-weight:bold;color:#17633e}
</style>
</head>
<body>
<header>
<h1>🏇 KEIBA AI</h1>
<p>Personal Horse Racing Prediction</p>
</header>

<div class="card">
<h2>① 競馬を選択</h2>
<button id="jra" class="active" onclick="setType('JRA')">JRA中央競馬</button>
<button id="local" onclick="setType('地方')">地方競馬</button>
<p id="type">JRA中央競馬</p>
</div>

<div class="card">
<h2>② レース情報</h2>
<label>競馬場</label>
<input id="place" placeholder="例：東京・船橋">
<label>レース番号</label>
<input id="race" type="number" placeholder="例：11">
<label>開催日（任意・複数日ある場合は必須／例：20261128）</label>
<input id="raceDate" inputmode="numeric" placeholder="例：20261128">
</div>

<div class="card">
<h2>③ 出走馬登録</h2>
<label>馬名</label>
<input id="horse" placeholder="馬名を入力">
<label>近走評価（1～10）</label>
<input id="ability" type="number" min="1" max="10" value="5">
<label>距離・コース適性（1～10）</label>
<input id="course" type="number" min="1" max="10" value="5">
<label>展開・脚質評価（1～10）</label>
<input id="pace" type="number" min="1" max="10" value="5">
<label>騎手評価（1～10）</label>
<input id="jockey" type="number" min="1" max="10" value="5">
<button onclick="addHorse()">馬を登録する</button>
<p class="small">各評価は入力した仮評価です。実際の競走データとはまだ連動していません。</p>
</div>
<label>CSV一括登録</label>

<label>出走馬CSV（horselist）</label>

<input type="file" id="horseFile" accept=".csv">

<label>レース情報CSV（racelist）</label>

<input type="file" id="raceFile" accept=".csv">

<label>払戻CSV（payback）</label>

<input type="file" id="paybackFile" accept=".csv">

<button onclick="importNARCSV()">CSV一括登録</button>
<div class="card">
<h2>④ 登録馬一覧</h2>
<div id="list">まだ馬が登録されていません。</div>
<button onclick="predict()">AI予想順位を計算</button>
</div>

<div class="card">
<h2>⑤ 予想結果</h2>
<div id="result">出走馬を登録してください。</div>
</div>

<p class="small">KEIBA AI 新規開発版 / Ver.1.0</p>
<script src="keiba-ai-v2.js"></script>
<script>
let horses=[];
let raceType="JRA";

function setType(type){
raceType=type;
document.getElementById("type").textContent=
type==="JRA"?"JRA中央競馬":"地方競馬";
document.getElementById("jra").classList.toggle("active",type==="JRA");
document.getElementById("local").classList.toggle("active",type==="地方");
}
async function importCSV(){

 const file=document.getElementById("csvFile").files[0];

 if(!file){

  alert("CSVファイルを選択してください");

  return;

 }

 const reader=new FileReader();

 reader.onload=function(){

  const rows=reader.result.replace(/^\uFEFF/,"").split(/\r?\n/);

  let count=0;

  let skip=0;

  rows.forEach((row,i)=>{

   if(!row.trim())return;

   const c=row.split(",").map(v=>v.trim());

   if(i===0&&c[0]==="馬名")return;

   if(c.length<5){skip++;return;}

   const name=c[0];

   const scores=c.slice(1,5).map(Number);

   if(!name||scores.some(v=>!Number.isInteger(v)||v<1||v>10)){

    skip++;return;

   }

   if(horses.some(h=>h.name===name)){

    skip++;return;

   }

   horses.push({

    name:name,

    ability:scores[0],

    course:scores[1],

    pace:scores[2],

    jockey:scores[3]

   });

   count++;

  });

  showHorses();

  alert(count+"頭登録しました。スキップ："+skip+"件");

 };

 reader.readAsText(file,"UTF-8");

}
async function importNARCSV(){
  const horseFile=document.getElementById("horseFile").files[0];
  const raceFile=document.getElementById("raceFile").files[0];
  const paybackFile=document.getElementById("paybackFile").files[0];
  const placeInput=document.getElementById("place").value.trim();
  const raceInput=document.getElementById("race").value.trim();
  const dateInput=(document.getElementById("raceDate")?.value||"").replace(/\\D/g,"");

  if(!window.KeibaCSV){
    alert("CSV読み込み機能が見つかりません。ページを再読み込みしてください。");
    return;
  }
  if(!horseFile || !raceFile){
    alert("出走馬CSV（horselist）とレース情報CSV（racelist）の両方を選択してください。");
    return;
  }
  if(!placeInput || !raceInput){
    alert("先に競馬場とレース番号を入力してください。");
    return;
  }

  try{
    const files=[horseFile,raceFile];
    if(paybackFile) files.push(paybackFile);
    const data=await window.KeibaCSV.importFiles(files);
    const norm=value=>String(value||"").replace(/[\\s　]/g,"").trim();
    const digits=value=>String(value||"").replace(/\\D/g,"");
    const placeKey=norm(placeInput);
    const raceKey=digits(raceInput);

    const matchingRaces=data.races.filter(r=>
      norm(r["競馬場"])===placeKey &&
      digits(r["レース番号"])===raceKey &&
      (!dateInput || digits(r["競走年月日"])===dateInput)
    );

    if(matchingRaces.length===0){
      alert("入力した競馬場・レース番号に一致するレースがracelistにありません。競馬場名はCSVと同じ表記で入力してください。");
      return;
    }

    const raceDates=[...new Set(matchingRaces.map(r=>digits(r["競走年月日"])).filter(Boolean))];
    if(raceDates.length>1){
      alert("同じ競馬場・レース番号が複数の日付にあります。開催日欄にYYYYMMDD形式で入力してください。候補："+raceDates.join("、"));
      return;
    }

    const selectedRace=matchingRaces[0];
    const selectedDate=digits(selectedRace["競走年月日"]);
    const selectedHorses=data.horses.filter(h=>
      norm(h["競馬場"])===placeKey &&
      digits(h["レース番号"])===raceKey &&
      digits(h["競走年月日"])===selectedDate
    );

    if(selectedHorses.length===0){
      alert("該当レースの出走馬がhorselistに見つかりません。CSVの開催日・競馬場・レース番号を確認してください。");
      return;
    }

    // NARの戦績表記「勝-2着-3着-その他」から、実績スコアを算出
    const recordScore=(record)=>{
      const m=String(record||"").match(/^(\\d+)-(\\d+)-(\\d+)-(\\d+)$/);
      if(!m) return {score:5,starts:0,known:false};
      const w=Number(m[1]), p=Number(m[2]), t=Number(m[3]), o=Number(m[4]);
      const starts=w+p+t+o;
      if(!starts) return {score:5,starts:0,known:false};
      const rate=(w+0.65*p+0.35*t)/starts;
      return {score:Math.max(1,Math.min(10,Math.round((4+6*rate)*100)/100)),starts,known:true};
    };
    const weightedRecord=(a,b)=>{
      const parts=[a,b].filter(x=>x.known && x.starts>0);
      if(!parts.length) return {score:5,known:false};
      const total=parts.reduce((s,x)=>s+x.starts,0);
      return {score:Math.round(parts.reduce((s,x)=>s+x.score*x.starts,0)/total*100)/100,known:true};
    };

    horses=[];
    selectedHorses.forEach(h=>{
      const name=String(h["馬名"]||"").trim();
      if(!name) return;
      const overall=recordScore(h["全成績"]);
      const venue=recordScore(h["当競馬場成績"]);
      const distance=recordScore(h["うち当距離成績"]);
      const jockeyRecord=recordScore(h["騎手成績"]);
      const courseRecord=weightedRecord(venue,distance);
      const weight=Number(String(h["負担重量"]||"").replace(/[^0-9.]/g,""));
      const finish=Number(String(h["着順"]||"").replace(/[^0-9]/g,""));
      horses.push({
        name,
        ability:overall.score,
        course:courseRecord.score,
        pace:5,
        jockey:jockeyRecord.score,
        abilityDataAvailable:overall.known,
        courseDataAvailable:courseRecord.known,
        jockeyDataAvailable:jockeyRecord.known,
        paceDataAvailable:false,
        gate:Number(h["枠番"])||0,
        number:Number(h["馬番"])||0,
        jockeyName:String(h["騎手名"]||""),
        trainer:String(h["調教師"]||""),
        carriedWeight:Number.isFinite(weight)?weight:null,
        finish:Number.isFinite(finish)&&finish>0?finish:null
      });
    });

    document.getElementById("place").value=selectedRace["競馬場"]||placeInput;
    document.getElementById("race").value=raceKey;
    const dateBox=document.getElementById("raceDate");
    if(dateBox) dateBox.value=selectedDate;
    showHorses();

    const raceInfo=[
      selectedRace["競走年月日"],
      selectedRace["競走種類名称"],
      selectedRace["レース名"],
      selectedRace["距離"] ? selectedRace["距離"]+"m" : "",
      selectedRace["天候"] ? "天候："+selectedRace["天候"] : "",
      selectedRace["馬場"] ? "馬場："+selectedRace["馬場"] : ""
    ].filter(Boolean).join("／");
    alert(raceInfo+"\n"+horses.length+"頭を登録しました。\n払戻CSV："+(paybackFile?"読み込み済み（払戻表示は次段階で対応）":"未選択"));
  }catch(error){
    alert("CSV読み込みエラー："+(error?.message||error));
  }
}
function addHorse(){
let name=document.getElementById("horse").value.trim();
if(!name){alert("馬名を入力してください");return;}
if(horses.some(h=>h.name===name)){alert("この馬は既に登録されています");return;}
let h={
name:name,
ability:Number(document.getElementById("ability").value),
course:Number(document.getElementById("course").value),
pace:Number(document.getElementById("pace").value),
jockey:Number(document.getElementById("jockey").value)
};
if([h.ability,h.course,h.pace,h.jockey].some(v=>!Number.isFinite(v)||v<1||v>10)){
alert("評価は1から10で入力してください");return;
}
horses.push(h);
document.getElementById("horse").value="";
showHorses();
}

function showHorses(){
document.getElementById("list").innerHTML=
horses.map((h,i)=>(i+1)+"番："+h.name).join("<br>");
}

function predict(){
if(horses.length<2){alert("2頭以上登録してください");return;}
if(!window.KeibaAI){

alert("AIエンジンが読み込まれていません");

return;

}

let sorted=window.KeibaAI.predict(

horses.map(h=>({

...h,

recent:h.ability,

style:h.pace

}))

);
document.getElementById("result").innerHTML=
"<p>"+raceType+" "+document.getElementById("place").value+
" "+document.getElementById("race").value+"R</p>"+
"<table><tr><th>順位</th><th>馬名</th><th>評価点</th></tr>"+
sorted.map((h,i)=>"<tr><td>"+(i+1)+
"</td><td>"+h.name+"</td><td>"+h.score.toFixed(2)+
"</td></tr>").join("")+"</table>"+
"<p class='result'>1位候補："+sorted[0].name+"</p>"+
"<p>穴馬候補："+(sorted.length>=3?sorted[sorted.length-1].name:"登録馬不足")+"</p>";
}
</script>
<script src="keiba-csv.js"></script>
</body>
</html>
